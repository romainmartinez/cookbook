onboarding = false
[theme]
name = "tokyo-night"

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+;"
rename_tab = "prefix+shift+t"
new_tab = ["prefix+c", "cmd+t"]
close_tab = ["prefix+shift+x", "cmd+w"]
previous_tab = ["prefix+p", "cmd+["]
next_tab = ["prefix+n", "cmd+]"]
move_tab_previous = "cmd+ctrl+["
move_tab_next = "cmd+ctrl+]"
previous_workspace = "cmd+shift+["
next_workspace = "cmd+shift+]"
previous_agent = "cmd+alt+["
next_agent = "cmd+alt+]"
switch_tab = "cmd+1..9"
switch_workspace = "cmd+ctrl+1..9"

[[keys.command]]
key = "ctrl+g"
type = "pane"
command = '''
sock="$HOME/.cache/herdr-nvim/$(printf %s "$HERDR_ACTIVE_PANE_ID" | tr : -).sock"
if nvim --server "$sock" --remote-expr 1 </dev/null >/dev/null 2>&1; then
	export NVIM="$sock"
fi
exec lazygit
'''

[[keys.command]]
key = "ctrl+e"
type = "pane"
description = "browse files (opens in the pane's neovim)"
# Socket per herdr pane, registered by nvim lua/config/options.lua.
# Custom commands identify the underlying pane with HERDR_ACTIVE_PANE_ID.
command = '''
sock="$HOME/.cache/herdr-nvim/$(printf %s "$HERDR_ACTIVE_PANE_ID" | tr : -).sock"
# without </dev/null nvim inits a tui and waits ~1s on terminal queries
nv() { nvim --server "$sock" "$@" </dev/null >/dev/null 2>&1; }
nv --remote-expr 1 || exec yazi
chooser=$(mktemp)
yazi --chooser-file "$chooser"
picked=$(cat "$chooser")
if [ -d "$picked" ]; then
	nv --remote-expr "chdir(readfile('$chooser')[0])"
elif [ -n "$picked" ]; then
	nv --remote "$picked"
fi
rm -f "$chooser"
'''

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "fish"
width = "90%"
height = "90%"

[[keys.command]]
key = "ctrl+'"
type = "popup"
description = "find a tab across all spaces"
command = "$HOME/.config/herdr/tab-picker.sh"
width = "70%"
height = "60%"

[ui]
sidebar_max_width = 18
hide_tab_bar_when_single_tab = true
prompt_new_tab_name = false
window_title = ""

status_indicators = "symbols"
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"]]

[experimental]
kitty_graphics = true
