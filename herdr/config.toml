onboarding = false
[theme]
name = "tokyo-night"

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+;"
rename_tab = "prefix+shift+t"
new_tab = ["prefix+c", "cmd+t"]
close_tab = ["prefix+shift+x", "cmd+w"]
previous_tab = ["prefix+p", "cmd+["]
next_tab = ["prefix+n", "cmd+]"]
move_tab_previous = "cmd+ctrl+["
move_tab_next = "cmd+ctrl+]"
previous_workspace = "cmd+shift+["
next_workspace = "cmd+shift+]"
previous_agent = "cmd+alt+["
next_agent = "cmd+alt+]"
switch_tab = "cmd+1..9"
switch_workspace = "cmd+ctrl+1..9"

[[keys.command]]
key = "ctrl+g"
type = "pane"
command = '''
target=$("$HOME/.config/herdr/find-nvim.sh" "$HERDR_WORKSPACE_ID")
if [ -n "$target" ]; then
	export NVIM="${target%%|*}"
	export HERDR_NVIM_TAB_ID="${target#*|}"
fi
exec lazygit
'''

[[keys.command]]
key = "ctrl+e"
type = "pane"
description = "browse files (opens in a neovim tab in this workspace)"
command = '''
target=$("$HOME/.config/herdr/find-nvim.sh" "$HERDR_WORKSPACE_ID")
[ -n "$target" ] || exec yazi
sock=${target%%|*}
target_tab=${target#*|}
# without </dev/null nvim inits a tui and waits ~1s on terminal queries
nv() { nvim --server "$sock" "$@" </dev/null >/dev/null 2>&1; }
chooser=$(mktemp)
trap 'rm -f "$chooser"' 0 1 2 15
yazi --chooser-file "$chooser"
IFS= read -r picked < "$chooser"
if [ -d "$picked" ]; then
	nv --remote-expr "chdir(readfile('$chooser')[0])" && herdr tab focus "$target_tab"
elif [ -n "$picked" ]; then
	nv --remote "$picked" && herdr tab focus "$target_tab"
fi
'''

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "fish"
width = "90%"
height = "90%"

[[keys.command]]
key = "cmd+space"
type = "popup"
description = "find a tab across all spaces"
command = "$HOME/.config/herdr/tab-picker.sh"
width = "62%"
height = "45%"

[ui]
sidebar_max_width = 18
hide_tab_bar_when_single_tab = true
prompt_new_tab_name = false
window_title = ""

status_indicators = "symbols"
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"]]

[experimental]
kitty_graphics = true
