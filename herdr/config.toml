onboarding = false
[theme]
name = "tokyo-night"

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+;"
rename_tab = "prefix+shift+t"

[[keys.command]]
key = "ctrl+g"
type = "pane"
command = "lazygit"

[[keys.command]]
key = "ctrl+e"
type = "popup"
description = "browse files (opens in the pane's neovim)"
# Socket per herdr pane, registered by nvim lua/config/options.lua.
# Popups get HERDR_ACTIVE_PANE_ID, not HERDR_PANE_ID.
command = '''
sock="$HOME/.cache/herdr-nvim/$(printf %s "$HERDR_ACTIVE_PANE_ID" | tr : -).sock"
# without </dev/null nvim inits a tui and waits ~1s on terminal queries
nv() { nvim --server "$sock" "$@" </dev/null >/dev/null 2>&1; }
nv --remote-expr 1 || exec spf
chooser=$(mktemp)
spf --chooser-file "$chooser"
picked=$(cat "$chooser")
if [ -d "$picked" ]; then
	nv --remote-expr "chdir(readfile('$chooser')[0])"
elif [ -n "$picked" ]; then
	nv --remote "$picked"
fi
rm -f "$chooser"
'''
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "fish"
width = "90%"
height = "90%"

[keys.indexed]
# quickly switch between workspaces and tabs with numbers
workspaces = "ctrl+shift"
tabs = "ctrl"

[ui]
hide_tab_bar_when_single_tab = true

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"]]

[experimental]
pane_history = false
kitty_graphics = true

[ui.sound]
enabled = true
