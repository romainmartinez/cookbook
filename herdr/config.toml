onboarding = false
[theme]
name = "tokyo-night"

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+;"
rename_tab = "prefix+shift+t"
previous_tab = ["prefix+p", "alt+["]
next_tab = ["prefix+n", "alt+]"]
move_tab_previous = "alt+ctrl+["
move_tab_next = "alt+ctrl+]"
previous_workspace = "alt+shift+["
next_workspace = "alt+shift+]"
switch_tab = "ctrl+1..9"
switch_workspace = "ctrl+shift+1..9"

[[keys.command]]
key = "ctrl+g"
type = "pane"
command = '''
sock="$HOME/.cache/herdr-nvim/$(printf %s "$HERDR_ACTIVE_PANE_ID" | tr : -).sock"
if nvim --server "$sock" --remote-expr 1 </dev/null >/dev/null 2>&1; then
	export NVIM="$sock"
fi
exec lazygit
'''

[[keys.command]]
key = "ctrl+e"
type = "popup"
description = "browse files (opens in the pane's neovim)"
# Socket per herdr pane, registered by nvim lua/config/options.lua.
# Popups get HERDR_ACTIVE_PANE_ID, not HERDR_PANE_ID.
command = '''
sock="$HOME/.cache/herdr-nvim/$(printf %s "$HERDR_ACTIVE_PANE_ID" | tr : -).sock"
# without </dev/null nvim inits a tui and waits ~1s on terminal queries
nv() { nvim --server "$sock" "$@" </dev/null >/dev/null 2>&1; }
nv --remote-expr 1 || exec spf
chooser=$(mktemp)
spf --chooser-file "$chooser"
picked=$(cat "$chooser")
if [ -d "$picked" ]; then
	nv --remote-expr "chdir(readfile('$chooser')[0])"
elif [ -n "$picked" ]; then
	nv --remote "$picked"
fi
rm -f "$chooser"
'''
width = "90%"
height = "100%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "fish"
width = "90%"
height = "90%"

[ui]
sidebar_max_width = 18
hide_tab_bar_when_single_tab = true
prompt_new_tab_name = false
window_title = ""

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"]]

[experimental]
kitty_graphics = true
