[metadata]
name = "dirs"
description = "A channel to select directories"
requirements = ["zoxide", "fd"]

[source]
command = [
  { name = "Frecency", run = "zoxide query --list --score | sed 's/^ *[0-9.]* *//'" },
  { name = "Recursive", run = "fd -t d" },
  { name = "Hidden", run = "fd -t d -H" },
  { name = "All", run = "fd -t d -H -I" },
]
no_sort = true
frecency = false

[preview]
command = "lsd -l --color=always '{}' 2>/dev/null || ls -la '{}'"
