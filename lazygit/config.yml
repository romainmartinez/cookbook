gui:
  showNumstatInFilesView: true
  nerdFontsVersion: "3"
  showIcons: true
  showRandomTip: false
  showCommandLog: false
  showDivergenceFromBaseBranch: arrowAndNumber
  scrollHeight: 4
  scrollOffMargin: 4
  theme:
    unstagedChangesColor:
      - "#db4b4b"
    selectedLineBgColor:
      - "#2e3c64"
    searchingActiveBorderColor:
      - "#ff9e64"
      - bold
    optionsTextColor:
      - "#7aa2f7"
    inactiveBorderColor:
      - "#29a4bd"
    defaultFgColor:
      - "#c0caf5"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    activeBorderColor:
      - "#ff9e64"
      - bold
git:
  disableForcePushing: true
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --wrap-max-lines unlimited
    - colorArg: always
      command: delta --paging=never --side-by-side --line-numbers-left-format= --line-numbers-right-format=│ --wrap-max-lines unlimited
    - colorArg: always
      command: cat
os:
  edit: 'if set -q REX_NVIM_BLOCK; ~/.config/rex/lazygit-to-nvim.sh {{filename}}; else if test -n "$NVIM"; nvim --server "$NVIM" --remote-tab {{filename}}; else; nvim -- {{filename}}; end'
  editAtLine: 'if set -q REX_NVIM_BLOCK; ~/.config/rex/lazygit-to-nvim.sh {{filename}} {{line}}; else if test -n "$NVIM"; nvim --server "$NVIM" --remote-tab {{filename}}; and nvim --server "$NVIM" --remote-send "<C-\\><C-n>:{{line}}<CR>"; else; nvim +{{line}} -- {{filename}}; end'
  openDirInEditor: 'if set -q REX_NVIM_BLOCK; ~/.config/rex/lazygit-to-nvim.sh {{dir}}; else if test -n "$NVIM"; nvim --server "$NVIM" --remote-tab {{dir}}; else; nvim -- {{dir}}; end'
  editInTerminal: true
customCommands:
  - key: "<c-s>"
    context: "global"
    description: "Show total line stats (working tree vs HEAD)"
    command: >-
      sh -c 'index=$(mktemp) || exit; trap "rm -f $index" 0; export GIT_INDEX_FILE=$index; git read-tree HEAD && git add -A && git diff --cached --shortstat'
    output: popup
