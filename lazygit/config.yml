gui:
  showNumstatInFilesView: true
  nerdFontsVersion: "3"
  showRandomTip: false
  showCommandLog: false
  showDivergenceFromBaseBranch: arrowAndNumber
  scrollHeight: 4
  scrollOffMargin: 4
  portraitModeAutoMinHeight: 0
  theme:
    unstagedChangesColor:
      - "#db4b4b"
    selectedLineBgColor:
      - "#2e3c64"
    searchingActiveBorderColor:
      - "#ff9e64"
      - bold
    optionsTextColor:
      - "#7aa2f7"
    inactiveBorderColor:
      - "#29a4bd"
    defaultFgColor:
      - "#c0caf5"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    activeBorderColor:
      - "#ff9e64"
      - bold
git:
  disableForcePushing: true
  diffRenderers:
    - command: $CODE_FOLDER/cookbook/lazygit/delta.awk width={{.width}}
    - type: rawGit
      name: default
os:
  edit: $CODE_FOLDER/cookbook/lazygit/edit.sh {{filename}}
  editAtLine: $CODE_FOLDER/cookbook/lazygit/edit.sh {{filename}} {{line}}
  openDirInEditor: $CODE_FOLDER/cookbook/lazygit/edit.sh {{dir}}
  editInTerminal: true
customCommands:
  - key: "<c-n>"
    context: "global"
    description: "Show total line stats (working tree vs HEAD)"
    command: >-
      sh -c 'index=$(mktemp) || exit; trap "rm -f $index" 0; export GIT_INDEX_FILE=$index; git read-tree HEAD && git add -A && git diff --cached --shortstat'
    output: popup
